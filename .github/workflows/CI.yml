name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Reject local-only release files
        shell: bash
        run: |
          if git ls-files --error-unmatch GATE_FINDINGS.md >/dev/null 2>&1; then
            echo 'Local release findings must never be committed.'
            exit 1
          fi
      - name: Secret-pattern grep
        shell: bash
        run: |
          # Heuristic only; never print a matched secret into CI logs.
          set +e
          git grep -I -l -E -e '-----BEGIN ([A-Z0-9]+ )*PRIVATE KEY-----' -e 'AKIA[0-9A-Z]{16}' -e 'gh[pousr]_[A-Za-z0-9]{36,}' -e 'github_pat_[A-Za-z0-9_]{60,}' -e 'xox[baprs]-[A-Za-z0-9-]{20,}' -- .
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo 'Potential secret found in the files listed above.'
            exit 1
          elif [ "$status" -ne 1 ]; then
            exit "$status"
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and test tools
        run: python -m pip install . pytest
      - name: Import every package module
        run: python tools/check_imports.py
      - name: Full test suite
        run: python -m pytest -q
      - name: Installed package smoke test outside checkout
        working-directory: ${{ runner.temp }}
        run: |
          sign-safe --help
          python -c "from sign_safe.decode.raw_calldata import SELECTORS; assert len(SELECTORS) == 112"
